name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check src/go-engine.js
          node --check src/ai.js
          node --check src/omok-engine.js
          node --check src/omok-ai.js
          node --check src/app.js
      - name: Run tests
        run: npm test
